<script>
  // Theme et langue poses avant le rendu pour eviter un flash.
  // Memes cles que le site en ligne : dh-theme, dh-lang.
  (function () {
    try {
      var th = localStorage.getItem('dh-theme');
      document.documentElement.dataset.theme = (th === 'light' || th === 'dark') ? th : 'dark';
      document.documentElement.classList.toggle('dark', document.documentElement.dataset.theme === 'dark');
      var lg = localStorage.getItem('dh-lang');
      if (lg === 'fr' || lg === 'en') document.documentElement.lang = lg;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>

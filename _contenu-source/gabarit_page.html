  /* ===== Sequence navigation : arrows + dots ===== */
  .sequence-container { position: relative; }
  .seq-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--glass-bg); backdrop-filter: blur(6px);
    border: 1px solid var(--hairline);

/* ═══ Sophie Chat Widget ═══ */
.sophie-launcher {

}

.sophie-drawer {

  overflow: hidden;
  animation: sophie-slide-up 0.28s cubic-bezier(0.2, 0.7, 0.3, 1.05);
}
@keyframes sophie-slide-up {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.sophie-drawer--full {
  bottom: 0; right: 0; top: 0; left: 0;

}

.sophie-drawer-head {

}

}
.sophie-head-title {

}

}

.sophie-head-btn {

}

}

.sophie-drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 18px;
  display: flex; flex-direction: column; gap: 14px;
}

}
.sophie-msg { display: flex; }
